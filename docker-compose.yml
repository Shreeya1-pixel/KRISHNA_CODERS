services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: syra-backend
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      SYRA_FEEDBACK_DB: /data/syra_feedback.db
    volumes:
      - syra-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/website
      dockerfile: Dockerfile
    container_name: syra-frontend
    ports:
      - "5174:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  syra-data:
    driver: local
