services:
  - type: web
    name: syra-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements-render.txt
    startCommand: uvicorn syra_backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SYRA_API_KEYS
        sync: false
      - key: SECUREC_ENABLE_LLM_AUGMENTATION
        value: "false"
      - key: SYRA_ENABLE_AGENT_LLM
        sync: false
      - key: SYRA_AGENT_LLM_SERVER_URL
        value: https://api.fireworks.ai/inference/v1
      - key: SYRA_AGENT_LLM_API_KEY
        sync: false
      - key: SYRA_POLICY_AGENT_MODEL
        sync: false
      - key: SYRA_FORENSICS_AGENT_MODEL
        sync: false
      - key: SYRA_REMEDIATION_AGENT_MODEL
        sync: false
      - key: SYRA_VERIFIER_AGENT_MODEL
        sync: false
      - key: FIREWORKS_API_KEY
        sync: false
      - key: FIREWORKS_BASE_URL
        value: https://api.fireworks.ai/inference/v1
      - key: FIREWORKS_DRY_RUN
        value: "false"
      - key: SYRA_FEEDBACK_DB
        value: /tmp/syra_feedback.db
      - key: SYRA_ENABLE_GPU_METRICS
        value: "false"
      - key: SYRA_VISUAL_DEMO_BASE
        sync: false
      - key: JIRA_BASE_URL
        sync: false
      - key: JIRA_EMAIL
        sync: false
      - key: JIRA_API_TOKEN
        sync: false
      - key: JIRA_PROJECT_KEY
        sync: false

  - type: web
    name: syra-frontend
    runtime: static
    rootDir: frontend/website
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
